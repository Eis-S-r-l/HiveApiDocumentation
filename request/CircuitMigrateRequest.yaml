type: object
required:
  - contact
  - idBuilding
  - timeslot
  - serviceId
  - mcrId
  - slaId
  - customerId
  - streetNumber
  - organizationId
  - userId
  - dac
  - mc
  - carrierName
  - oloCode
  - technology
properties:
  contact:
    type: object
    required:
      - firstName
      - lastName
      - email
      - mobile_number
      - fixed_number
    properties:
      firstName: { type: string }
      lastName: { type: string }
      email: { type: string }
      mobile_number: { type: string }
      fixed_number: { type: string }
  idBuilding: { type: string }
  timeslot: { type: integer }
  serviceId: { type: integer }
  mcrId: { type: integer }
  slaId: { type: integer }
  customerId: { type: integer }
  streetNumber: { type: string }
  organizationId: { type: integer }
  userId: { type: integer }
  dac: { type: string }
  publicIpv6: { type: boolean }
  ipv4AdditionalId: { type: integer }
  ipv6AdditionalId: { type: integer }
  residentialContext: { type: string }
  stair: { type: string }
  floor: { type: string }
  unit: { type: string }
  mc: { type: string }
  carrierName: { type: string }
  oloCode: { type: string }
  tempUsername: { type: string }
  tempPassword: { type: string }
  technology: { type: string }
  directoryNumbers:
    type: array
    items:
      type: string
