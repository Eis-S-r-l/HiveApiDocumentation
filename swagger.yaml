openapi: 3.1.0
info:
  title: HIVE DaaS Portal API
  description: |
    ![Image](images/logo.png)
    # Documentazione delle API per il portale di Hive

    ## Autenticazione
    L'autenticazione alle API avviene attraverso una API Key (Refresh Token) che può essere generata dal portale.
    La generazione avviene nella sezione **Profilo Utente > API Keys** del portale Hive.
    Una volta completato il processo, verranno forniti il clientId e la API Key.

    ### Ottenimento del Token
    Per ottenere un access token, effettuare una chiamata POST al seguente endpoint:

    [`/auth/api-key/login`](#/Authorization/post_auth_api_key_login)


    #### Durata dei token
    - **Access Token**: valido per 24 ore
    - **Refresh Token (API Key)**: valido per 10 anni

    ### Utilizzo dell'Access Token
    L'access token ottenuto deve essere incluso nell'header di ogni richiesta successiva come segue:

    ```
    Authorization: Bearer {access_token}
    ```

    # Moduli

    ## Device as a Service (DaaS)
    Questa suite di API è fondamentale per provisionare e configurare i servizi necessari alla gestione completa del ciclo di vita dei dispositivi (DaaS). Fornisce gli strumenti per gestire l'anagrafica, i cataloghi prodotti, le offerte commerciali e gli ordini di assistenza.

    ### Flusso Operativo Obbligatorio
    Le chiamate devono seguire la seguente sequenza logica:

    ### 1. Preparazione Iniziale (Dati Base)
    - Creare Anagrafica
    - Creare Categoria / Fornitore  
    - Aggiungere Prodotto

    ### 2. Creazione Offerta
    - Creare Offerta
    - Associare Devices
    - Aggiungere Accessori / Servizi

    ### 3. Creazione Ordine di Assistenza
    - Generare un ordine per device

    ### Istruzioni POST e Caricamento File
    Per associare file multipli agli elementi, usare: `files.{idElement}`

    **Esempio:**
    ```
    files.24 => [ image1.jpg, img2.png ]
    ```

    **Requisiti file:**
    I caratteri consentiti per i nomi dei file sono i seguenti:
    - Lettere maiuscole: dalla A alla Z
    - Lettere minuscole: dalla a alla z
    - Numeri: dallo 0 al 9
    - Spazio
    - Trattino basso (underscore): _
    - Punto: .
    - Trattino: -

    **Dimensione massima per file:** 5MB

