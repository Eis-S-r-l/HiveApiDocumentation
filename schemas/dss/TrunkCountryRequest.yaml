type: object
description: Request payload for managing a DSS trunk destination.
properties:
  idTrunk: { type: integer, description: DSS trunk identifier, example: 45 }
  organizationId: { type: integer, description: Organization identifier, example: 10 }
  sbcId: { type: integer, description: Session border controller identifier, example: 2 }
  iso: { type: string, description: Country ISO code, example: IT }
  premium_available: { type: string, description: Premium traffic availability value }
required: [idTrunk, iso]
