type: object
properties:
  id: { type: integer, format: int64 }
  code: { type: string }
  label: { type: string }
  revision: { type: integer }
  fields:
    type: array
    items:
      $ref: "#/$defs/Field"
  outputs:
    type: array
    items:
      $ref: "#/$defs/Output"
required: [id, code, label, revision, fields, outputs]
$defs:
  Field:
    type: object
    properties:
      key: { type: string }
      label: { type: string }
      type: { type: string }
      source: { type: string }
      resolverType: { type: [string, "null"] }
      required: { type: boolean }
      overridable: { type: boolean }
      sensitive: { type: boolean }
      exposeOnCreate: { type: boolean }
      displayOrder: { type: integer }
      config:
        description: Preset-specific field configuration.
    required: [key, label, type, source, required, overridable, sensitive, exposeOnCreate, displayOrder]
  Output:
    type: object
    properties:
      key: { type: string }
      label: { type: string }
      fieldType: { type: string }
      sensitive: { type: boolean }
      oneTime: { type: boolean }
      copyable: { type: boolean }
      displayOrder: { type: integer }
    required: [key, label, fieldType, sensitive, oneTime, copyable, displayOrder]
